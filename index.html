<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tintenfunken – Drucklayout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="controls">
    <span class="brand">Tintenfunken</span>
    <div class="control-group">
      <span class="control-label">Duplex</span>
      <select id="duplexMode">
        <option value="manual">Manuell</option>
        <option value="auto">Automatisch</option>
      </select>
    </div>
    <div class="control-group">
      <span class="control-label">Wendeseite</span>
      <select id="flipEdge">
        <option value="long">Lange Kante</option>
        <option value="short">Kurze Kante</option>
      </select>
    </div>
    <label class="toggle-label">
      <input type="checkbox" id="showImages" checked>
      <span>Bilder</span>
    </label>
    <button id="printButton">Drucken</button>
  </nav>
  <main id="sheets"></main>

  <template id="card-front-template">
    <div class="card card-front">
      <div class="top-band">
        <span class="category-text" data-field="category"></span>
        <span class="card-id" data-field="id"></span>
      </div>
      <div class="title-area">
        <h2 class="card-title" data-field="title"></h2>
        <div class="title-rule"></div>
      </div>
      <div class="illustration">
        <img alt="" data-field="img">
      </div>
      <div class="essence-area">
        <p class="essence-text" data-field="essence"></p>
      </div>
    </div>
  </template>

  <template id="card-back-template">
    <div class="card card-back">
      <div class="back-header">
        <div class="back-category" data-field="category"></div>
        <div class="back-title" data-field="title"></div>
      </div>
      <div class="back-body">
        <div class="field">
          <div class="field-label">Funktion</div>
          <p class="field-text" data-field="function"></p>
        </div>
        <div class="rule"></div>
        <div class="field">
          <div class="field-label">Anwendung</div>
          <p class="field-text" data-field="application"></p>
        </div>
        <div class="rule"></div>
        <div class="field">
          <div class="field-label">Beispiele</div>
          <p class="field-text examples" data-field="example"></p>
        </div>
        <!-- both nodes share data-optional so they're removed together when pitfall is absent -->
        <div class="rule" data-optional="pitfall"></div>
        <div class="pitfall-block" data-optional="pitfall">
          <p class="pitfall-text" data-field="pitfall"></p>
        </div>
      </div>
      <div class="back-footer">
        <div class="pairs-row" data-optional="pairs">
          <span class="pairs-label">Passt&nbsp;zu</span>
          <div class="tags" data-field="tags"></div>
        </div>
        <p class="source-text" data-optional="source" data-field="source"></p>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
