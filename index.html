<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tintenfunken – Drucklayout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="controls">
    <span class="brand">Tintenfunken</span>
    <div class="control-group">
      <span class="ctrl-label">Duplex</span>
      <select id="duplexMode">
        <option value="manual">Manuell</option>
        <option value="auto">Automatisch</option>
      </select>
    </div>
    <div class="control-group">
      <span class="ctrl-label">Wendeseite</span>
      <select id="flipEdge">
        <option value="long">Lange Kante</option>
        <option value="short">Kurze Kante</option>
      </select>
    </div>
    <label class="toggle-label">
      <input type="checkbox" id="showImages" checked>
      <span>Bilder</span>
    </label>
    <button id="printBtn">Drucken</button>
  </nav>
  <main id="sheets"></main>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
